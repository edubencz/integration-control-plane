k8s-dev:
  stage: deploy
  image:
    name: ${IMG_DOCKER_KUBECTL}
    entrypoint: [""]
  tags:
    - int-lnx-run01
  variables:
    CONTEXT: gitlab-ci-integration-dev
    TAG: $CI_COMMIT_SHA
    KUBECONFIG_CONTENT_BASE64: ${KUBECONFIG_BASE64_INTEGRATION_DEV}
    INGRESS_URL: ${ICP_INGRESS_URL_DEV}
    VAR_REPLICAS: 1
    VAR_TERMINATION_GRACE_PERIOD_SECONDS: 30
    VAR_CONTAINERS_RESOURCES_REQUESTS_CPU: 100m
    VAR_CONTAINERS_RESOURCES_REQUESTS_MEMORY: 512Mi
    VAR_CONTAINERS_RESOURCES_LIMITS_CPU: 300m
    VAR_CONTAINERS_RESOURCES_LIMITS_MEMORY: 768Mi
    VAR_MAX_REPLICAS: 1
    VAR_MIN_REPLICAS: 1
    DB_HOST: ${ICP_DB_HOST_DEV}
    DB_PORT: ${ICP_DB_PORT_DEV}
    DB_NAME: ${ICP_DB_NAME_DEV}
    DB_USERNAME: ${ICP_DB_USERNAME_DEV}
    DB_PASSWORD: ${ICP_DB_PASSWORD_DEV}
    DB_USE_TLS: "false"
    ICP_ADMIN_PASSWORD: ${ICP_ADMIN_PASSWORD_DEV}
    FRONTEND_JWT_HMAC_SECRET: ${ICP_FRONTEND_JWT_HMAC_SECRET_DEV}
    USER_SERVICE_JWT_HMAC_SECRET: ${ICP_USER_SERVICE_JWT_HMAC_SECRET_DEV}
    OBSERVABILITY_JWT_HMAC_SECRET: ${ICP_OBSERVABILITY_JWT_HMAC_SECRET_DEV}
    OPENSEARCH_URL: ${ICP_OPENSEARCH_URL_DEV}
    OPENSEARCH_USERNAME: ${ICP_OPENSEARCH_USERNAME_DEV}
    OPENSEARCH_PASSWORD: ${ICP_OPENSEARCH_PASSWORD_DEV}
    LOG_LEVEL: INFO
  environment:
    name: k8s-dev
    url: https://${INGRESS_URL}
  extends:
    - .script-deploy
    - .rules-deploy-dev

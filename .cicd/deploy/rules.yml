.rules-deploy-dev:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_REF_NAME =~ /^develop$/
      when: manual
    - if: $CI_COMMIT_REF_NAME =~ /^(feature|fix)\//
      when: manual
    - when: never

.rules-deploy-rls:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG =~ /^[0-9]+(?:\.[0-9]+)+-RC\.[0-9]{3}$/ ## && $CI_COMMIT_REF_NAME =~ /^(release|hotfix)\//
      when: manual
    - when: never

.rules-deploy-hml:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG =~ /^[0-9]+(?:\.[0-9]+)+-RC\.[0-9]{3}$/ ## && $CI_COMMIT_REF_NAME =~ /^(release|hotfix)\//
      when: manual
    - if: $CI_COMMIT_TAG =~ /^[0-9]+(?:\.[0-9]+)+$/
      when: manual
    - when: never

.rules-deploy-prd:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG =~ /^[0-9]+(?:\.[0-9]+)+$/ && $CI_COMMIT_REF_PROTECTED == "true"
      when: manual
    - when: never

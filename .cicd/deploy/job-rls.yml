k8s-rls:
  stage: deploy
  image: 
    name: ${IMG_DOCKER_KUBECTL}
    entrypoint: [""]
  tags:
    - int-lnx-run01
  variables:
    CONTEXT: gitlab-ci-integration-rls
    TAG: $CI_COMMIT_TAG
    KUBECONFIG_CONTENT_BASE64: ${KUBECONFIG_BASE64_INTEGRATION_RLS}
    INGRESS_URL: ${ICP_INGRESS_URL_RLS}
    VAR_REPLICAS: 1
    VAR_TERMINATION_GRACE_PERIOD_SECONDS: 30
    VAR_CONTAINERS_RESOURCES_REQUESTS_CPU: 100m
    VAR_CONTAINERS_RESOURCES_REQUESTS_MEMORY: 512Mi
    VAR_CONTAINERS_RESOURCES_LIMITS_CPU: 300m
    VAR_CONTAINERS_RESOURCES_LIMITS_MEMORY: 768Mi
    VAR_MAX_REPLICAS: 1
    VAR_MIN_REPLICAS: 1
    DB_HOST: ${ICP_DB_HOST_RLS}
    DB_PORT: ${ICP_DB_PORT_RLS}
    DB_NAME: ${ICP_DB_NAME_RLS}
    DB_USERNAME: ${ICP_DB_USERNAME_RLS}
    DB_PASSWORD: ${ICP_DB_PASSWORD_RLS}
    DB_USE_TLS: "true"
    ICP_ADMIN_PASSWORD: ${ICP_ADMIN_PASSWORD_RLS}
    FRONTEND_JWT_HMAC_SECRET: ${ICP_FRONTEND_JWT_HMAC_SECRET_RLS}
    USER_SERVICE_JWT_HMAC_SECRET: ${ICP_USER_SERVICE_JWT_HMAC_SECRET_RLS}
    OBSERVABILITY_JWT_HMAC_SECRET: ${ICP_OBSERVABILITY_JWT_HMAC_SECRET_RLS}
    OPENSEARCH_URL: ${ICP_OPENSEARCH_URL_RLS}
    OPENSEARCH_USERNAME: ${ICP_OPENSEARCH_USERNAME_RLS}
    OPENSEARCH_PASSWORD: ${ICP_OPENSEARCH_PASSWORD_RLS}
    LOG_LEVEL: INFO
  environment:
    name: k8s-rls
    url: https://${INGRESS_URL}
  extends:
    - .script-deploy
    - .rules-deploy-rls

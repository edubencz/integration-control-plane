.rules-build:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: on_success
    - if: $CI_COMMIT_REF_NAME == "develop"
      when: on_success
    - if: $CI_COMMIT_REF_NAME =~ /^(feature|fix)\//
      when: on_success
    - if: $CI_COMMIT_TAG =~ /^[0-9]+(?:\.[0-9]+)+(-RC\.[0-9]{3})?$/
      when: on_success
    - if: $CI_COMMIT_REF_NAME =~ /^(feature|fix)\//
      when: on_success
    - if: $CI_COMMIT_TAG =~ /^[0-9]+(?:\.[0-9]+)+-RC\.[0-9]{3}$/
      when: on_success
    - if: $CI_COMMIT_TAG =~ /^[0-9]+(?:\.[0-9]+)+$/
      when: on_success
    - when: never
